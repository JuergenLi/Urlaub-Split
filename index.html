// ── PIN-HASH (global verfügbar für alle Komponenten) ──────────────────────────
async function hashPin(pin) {
  try {
    const msgBuffer = new TextEncoder().encode(pin + "urlaubsapp2026");
    const hashBuffer = await crypto.subtle.digest("SHA-256", msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, "0")).join("").slice(0, 16);
  } catch(e) {
    // Fallback für Browser ohne crypto.subtle
    let hash = 0;
    const str = pin + "urlaubsapp2026";
    for (let i = 0; i < str.length; i++) {
      hash = ((hash << 5) - hash) + str.charCodeAt(i);
      hash |= 0;
    }
    return Math.abs(hash).toString(16).padStart(16, "0");
  }
}

// ── BERECHNUNGS-ENGINE ────────────────────────────────────────────────────────
function berechne(reise, allPersonen) {
  const { gruppen, ausgaben, anwesenheit, einzahlungen } = reise;
  // Alle beteiligten Personen (Mitglieder irgendeiner Gruppe)
  const mitgliederIds = [...new Set(gruppen.flatMap(g => g.mitglieder))];
  const personen = allPersonen.filter(p => mitgliederIds.includes(p.id));

  // personId → gruppenIds
  const personGruppen = {};
  personen.forEach(p => {
    personGruppen[p.id] = gruppen.filter(g => g.mitglieder.includes(p.id)).map(g => g.id);
  });

  // Anteil je Person aus einer Ausgabe berechnen
  const anteile = {};
  personen.forEach(p => { anteile[p.id] = 0; });

  ausgaben.forEach(a => {
    const brutto = parseFloat(a.betrag) || 0;

    // Extrakosten rausrechnen
    const ekSumme = (a.extrakosten || []).reduce((s, e) => s + (parseFloat(e.betrag) || 0), 0);
    const netto = Math.max(0, brutto - ekSumme);

    // Zielgruppe bestimmen
    let zielIds = [];
    if (a.verteilungsModus === "alle") {
      zielIds = mitgliederIds;
    } else if (a.verteilungsModus === "anwesende") {
      zielIds = mitgliederIds.filter(id => (anwesenheit[id] || []).includes(a.datum));
      if (zielIds.length === 0) zielIds = mitgliederIds;
    } else if (a.verteilungsModus === "gruppen") {
      zielIds = [...new Set((a.verteilungsZiele || []).flatMap(gid => {
        const g = gruppen.find(x => x.id === gid);
        return g ? g.mitglieder : [];
      }))];
    } else if (a.verteilungsModus === "personen") {
      zielIds = a.verteilungsZiele || [];
    }
    if (zielIds.length === 0) zielIds = mitgliederIds;

    // Nettobetrag gleichmäßig auf Zielgruppe
    const pro = netto / zielIds.length;
    zielIds.forEach(id => { if (anteile[id] !== undefined) anteile[id] += pro; });

    // Extrakosten je Ziel
    (a.extrakosten || []).forEach(ek => {
      const ekB = parseFloat(ek.betrag) || 0;
      if (ek.zielTyp === "gruppe") {
        const g = gruppen.find(x => x.id === ek.zielId);
        if (g) {
          const proPerson = ekB / g.mitglieder.length;
          g.mitglieder.forEach(id => { if (anteile[id] !== undefined) anteile[id] += proPerson; });
        }
      } else if (ek.zielTyp === "person") {
        if (anteile[ek.zielId] !== undefined) anteile[ek.zielId] += ekB;
      }
    });
  });

  // Eingezahlt je Person:
  // 1. Manuelle Einzahlungen
  // 2. + selbst bezahlte Ausgaben (wer eine Ausgabe bezahlt hat, hat diesen Betrag faktisch eingezahlt)
  const eingezahltMap = {};
  personen.forEach(p => { eingezahltMap[p.id] = 0; });

  // Manuelle Einzahlungen
  einzahlungen.forEach(e => {
    if (eingezahltMap[e.personId] !== undefined)
      eingezahltMap[e.personId] += parseFloat(e.betrag) || 0;
  });

  // Bezahlte Ausgaben automatisch anrechnen (nur Personen, keine Gruppen als Bezahler)
  ausgaben.forEach(a => {
    if (a.bezahlerTyp === "person" && eingezahltMap[a.bezahlerId] !== undefined)
      eingezahltMap[a.bezahlerId] += parseFloat(a.betrag) || 0;
  });

  const bilanzen = personen.map(p => ({
    ...p,
    anteil:       anteile[p.id]      || 0,
    eingezahlt:   eingezahltMap[p.id] || 0,
    // Aufschlüsselung für UI
    manuellEingezahlt: einzahlungen.filter(e=>e.personId===p.id).reduce((s,e)=>s+(parseFloat(e.betrag)||0),0),
    bezahltAusgaben:   ausgaben.filter(a=>a.bezahlerTyp==="person"&&a.bezahlerId===p.id).reduce((s,a)=>s+(parseFloat(a.betrag)||0),0),
    bilanz: (eingezahltMap[p.id] || 0) - (anteile[p.id] || 0),
    gruppenIds: personGruppen[p.id] || [],
  }));

  // Ausgleich
  const gl = bilanzen.filter(p => p.bilanz > 0.01).map(p => ({ id: p.id, name: p.name, rest: p.bilanz }));
  const sc = bilanzen.filter(p => p.bilanz < -0.01).map(p => ({ id: p.id, name: p.name, rest: Math.abs(p.bilanz) }));
  const transfers = [];
  let gi = 0, si = 0;
  while (gi < gl.length && si < sc.length) {
    const b = Math.min(gl[gi].rest, sc[si].rest);
    if (b > 0.01) transfers.push({ von: sc[si].id, vonName: sc[si].name, an: gl[gi].id, anName: gl[gi].name, betrag: b });
    gl[gi].rest -= b; sc[si].rest -= b;
    if (gl[gi].rest < 0.01) gi++;
    if (sc[si].rest < 0.01) si++;
  }

  // Gruppen-Bilanz
  const gruppenBilanz = gruppen.map(g => {
    const mb = bilanzen.filter(p => g.mitglieder.includes(p.id));
    return { ...g, gesamtAnteil: mb.reduce((s,p)=>s+p.anteil,0), gesamtEingezahlt: mb.reduce((s,p)=>s+p.eingezahlt,0), bilanz: mb.reduce((s,p)=>s+p.bilanz,0) };
  });

  return { bilanzen, transfers, gruppenBilanz };
}

// ── URL-SHARE: State → URL → State ───────────────────────────────────────────
function encodeState(personen, reisen) {
  try {
    const json = JSON.stringify({ personen, reisen });
    const b64  = btoa(unescape(encodeURIComponent(json)));
    return b64;
  } catch(e) { return null; }
}

function decodeState(b64) {
  try {
    const json = decodeURIComponent(escape(atob(b64)));
    return JSON.parse(json);
  } catch(e) { return null; }
}

function loadFromURL() {
  try {
    const hash = window.location.hash.slice(1);
    if (!hash) return null;
    const params = new URLSearchParams(hash);
    const data = params.get("d");
    if (!data) return null;
    return decodeState(data);
  } catch(e) { return null; }
}

      color:"#fff", fontWeight:700, fontSize:size*0.38, flexShrink:0,
      boxShadow:"0 2px 6px rgba(0,0,0,0.25)" }}>
      {(name||"?").slice(0,2).toUpperCase()}
    </div>
  );
}

function Badge({ label, color="#888" }) {

// ── MODAL ─────────────────────────────────────────────────────────────────────
function Modal({ open, onClose, title, width=520, children }) {
  if (!open) return null;
  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(8,10,20,0.8)", display:"flex",
      alignItems:"center", justifyContent:"center", zIndex:1000, padding:16 }}
      onClick={onClose}>
      <div style={{ background:"#181b2c", border:"1px solid #2a2d42", borderRadius:18,
        padding:28, width:`min(${width}px, 96vw)`, maxHeight:"92vh", overflowY:"auto" }}
        onClick={e=>e.stopPropagation()}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20 }}>
          <h3 style={{ margin:0, color:"#e8eaf0", fontSize:17 }}>{title}</h3>
          <button onClick={onClose} style={{ background:"none", border:"none", color:"#666", fontSize:24, cursor:"pointer", lineHeight:1 }}>×</button>
        </div>
        {children}
      </div>
    </div>
  );
}

// ─── EINZAHLUNGS-FORMULAR ────────────────────────────────────────────────────
function EinzahlungForm({ person, reise, onSave }) {
  const existing = (reise.einzahlungen||[]).filter(e=>e.personId===person.id);
  const [einzahlungen, setEinzahlungen] = useState(
    existing.length > 0
      ? existing.map(e=>({ id:e.id||uid(), betrag:String(e.betrag), notiz:e.notiz||"", datum:e.datum||"" }))
      : [{ id:uid(), betrag:"", notiz:"", datum:"" }]
  );
  function addZeile() { setEinzahlungen(p=>[...p,{id:uid(),betrag:"",notiz:"",datum:""}]); }
  function removeZeile(id) { setEinzahlungen(p=>p.filter(e=>e.id!==id)); }
  function updateZeile(id,key,val) { setEinzahlungen(p=>p.map(e=>e.id===id?{...e,[key]:val}:e)); }
  const gesamt = einzahlungen.reduce((s,e)=>s+(parseFloat(e.betrag)||0),0);
  const fmtL = n => new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR"}).format(n||0);
  function handleSave() {
    const valid = einzahlungen.filter(e=>parseFloat(e.betrag)>0);
    if (!valid.length) return;
    onSave(person.id, valid.map(e=>({id:e.id,betrag:parseFloat(e.betrag)||0,notiz:e.notiz,datum:e.datum})));
  }
  return (
    <div>
      <div style={{fontSize:12,color:"#555",marginBottom:14}}>Mehrere Teilzahlungen möglich</div>
      {einzahlungen.map((e,i)=>(
        <div key={e.id} style={{background:"#0e1020",border:"1px solid #2a2d42",borderRadius:10,padding:12,marginBottom:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <span style={{fontSize:12,color:"#555",fontWeight:700}}>#{i+1}</span>
            {einzahlungen.length>1 && <button onClick={()=>removeZeile(e.id)} style={{background:"none",border:"none",color:"#e85a5a",cursor:"pointer",fontSize:18}}>×</button>}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
            <div><label style={S.label}>Betrag (€)</label>
              <input style={S.input} type="number" step="0.01" placeholder="0.00"
                value={e.betrag} onChange={ev=>updateZeile(e.id,"betrag",ev.target.value)}/></div>
            <div><label style={S.label}>Datum</label>
              <input style={S.input} type="date"
                value={e.datum} onChange={ev=>updateZeile(e.id,"datum",ev.target.value)}/></div>
          </div>
          <div><label style={S.label}>Notiz</label>
            <input style={S.input} placeholder="z.B. Banküberweisung"
              value={e.notiz} onChange={ev=>updateZeile(e.id,"notiz",ev.target.value)}/></div>
        </div>
      ))}
      <button onClick={addZeile} style={{...S.btn("#a0e4c8"),width:"100%",marginBottom:16,textAlign:"center"}}>
        + Weitere Einzahlung
      </button>
      <div style={{display:"flex",justifyContent:"space-between",background:"#1a1d2e",borderRadius:10,padding:"10px 14px",marginBottom:16}}>
        <span style={{fontSize:13,color:"#888"}}>Gesamt</span>
        <span style={{fontSize:18,fontWeight:800,color:"#7eb8f7"}}>{fmtL(gesamt)}</span>
      </div>
      <button style={S.btnPrimary} onClick={handleSave}>Speichern</button>
    </div>
  );
}

function AusgabeModal({ open, onClose, reise, allPersonen, initial, onSave, onDelete }) {
  const blank = {
    beschreibung:"", betrag:"", datum: new Date().toISOString().slice(0,10),
    bezahlerTyp:"person", bezahlerId: reise.gruppen[0]?.mitglieder[0] || "",
    verteilungsModus:"anwesende", verteilungsZiele:[], extrakosten:[],
  };
  const [f, setF] = useState(initial || blank);
  const [ekForm, setEkForm] = useState({ zielTyp:"gruppe", zielId:"", betrag:"" });

  const update = (k,v) => setF(p => ({...p,[k]:v}));
  const toggleZiel = id => setF(p => ({...p, verteilungsZiele: p.verteilungsZiele.includes(id) ? p.verteilungsZiele.filter(x=>x!==id) : [...p.verteilungsZiele, id]}));
  const addEk = () => {
    if (!ekForm.zielId || !ekForm.betrag) return;
    setF(p => ({...p, extrakosten:[...p.extrakosten, {...ekForm, id:uid(), betrag:parseFloat(ekForm.betrag)}]}));
    setEkForm({ zielTyp:"gruppe", zielId:"", betrag:"" });
  };
  const allPInReise = allPersonen.filter(p => reise.gruppen.some(g => g.mitglieder.includes(p.id)));

  const bezahlerOptionen = f.bezahlerTyp==="person"
    ? allPInReise.map(p => <option key={p.id} value={p.id}>{p.name} {p.nachname}</option>)
    : reise.gruppen.map(g => <option key={g.id} value={g.id}>{g.name}</option>);

  const ekZielOptionen = ekForm.zielTyp==="gruppe"
    ? reise.gruppen.map(g => <option key={g.id} value={g.id}>{g.name}</option>)
    : allPInReise.map(p => <option key={p.id} value={p.id}>{p.name}</option>);

  return (
    <Modal open={open} onClose={onClose} title={initial ? "Ausgabe bearbeiten" : "Neue Ausgabe"} width={580}>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
        <div style={{ gridColumn:"1/-1", ...S.row }}>
          <label style={S.label}>Beschreibung</label>
          <input style={S.input} value={f.beschreibung} onChange={e=>update("beschreibung",e.target.value)} placeholder="Wofür?" />
        </div>
        <div style={S.row}>
          <label style={S.label}>Betrag (€)</label>
          <input style={S.input} type="number" step="0.01" value={f.betrag} onChange={e=>update("betrag",e.target.value)} />
        </div>
        <div style={S.row}>
          <label style={S.label}>Datum</label>
          <input style={S.input} type="date" value={f.datum} onChange={e=>update("datum",e.target.value)} />
        </div>
        
        <div style={S.row}>
          <label style={S.label}>Bezahlt von – Typ</label>
          <select style={S.select} value={f.bezahlerTyp} onChange={e=>update("bezahlerTyp",e.target.value)}>
            <option value="person">Person</option>
            <option value="gruppe">Gruppe</option>
          </select>
        </div>
        <div style={S.row}>
          <label style={S.label}>Bezahler</label>
          <select style={S.select} value={f.bezahlerId} onChange={e=>update("bezahlerId",e.target.value)}>
            {bezahlerOptionen}
          </select>
        </div>
        
        <div style={{ gridColumn:"1/-1", ...S.row }}>
          <label style={S.label}>Verteilung</label>
          <select style={S.select} value={f.verteilungsModus} onChange={e=>update("verteilungsModus",e.target.value)}>
            <option value="alle">Alle Teilnehmer gleichmäßig</option>
            <option value="anwesende">Nur Anwesende an diesem Tag</option>
            <option value="gruppen">Nur bestimmte Gruppen</option>
            <option value="personen">Nur bestimmte Personen</option>
          </select>
        </div>
        
        {(f.verteilungsModus==="gruppen"||f.verteilungsModus==="personen") && (
          <div style={{ gridColumn:"1/-1", ...S.row }}>
            <label style={S.label}>{f.verteilungsModus==="gruppen" ? "Gruppen auswählen" : "Personen auswählen"}</label>
            <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
              {(f.verteilungsModus==="gruppen" ? reise.gruppen : allPInReise).map(x => {
                const sel = f.verteilungsZiele.includes(x.id);
                const c = x.farbe||"#888";
                return <button key={x.id} onClick={()=>toggleZiel(x.id)}
                  style={{ background:sel?c+"33":"#0e1020", border:`1px solid ${sel?c:"#2a2d42"}`, color:sel?c:"#666", borderRadius:8, padding:"6px 14px", cursor:"pointer", fontSize:13, fontWeight:sel?700:400 }}>
                  {x.name}
                </button>;
              })}
            </div>
          </div>
        )}
      </div>

      
      <div style={S.sep} />
      <div style={{ marginBottom:12 }}>
        <label style={S.label}>➕ Extrakosten / Sonderanteile</label>
        <div style={{ fontSize:12, color:"#555", marginBottom:10 }}>Betrag wird vom Gesamtbetrag abgezogen und direkt zugeordnet</div>
        {f.extrakosten.map((ek,i) => {
          const zname = ek.zielTyp==="gruppe"
            ? reise.gruppen.find(g=>g.id===ek.zielId)?.name
            : allPInReise.find(p=>p.id===ek.zielId)?.name;
          return (
            <div key={ek.id||i} style={{ display:"flex", alignItems:"center", gap:8, marginBottom:6, background:"#0e1020", borderRadius:8, padding:"6px 10px" }}>
              <span style={{ fontSize:12, color:"#a0e4c8", flex:1 }}>{ek.zielTyp==="gruppe"?"👥":"👤"} {zname} → {fmt(ek.betrag)}</span>
              <button onClick={()=>setF(p=>({...p,extrakosten:p.extrakosten.filter((_,j)=>j!==i)}))} style={{ background:"none", border:"none", color:"#e85a5a", cursor:"pointer", fontSize:16 }}>×</button>
            </div>
          );
        })}
        <div style={{ display:"grid", gridTemplateColumns:"auto 1fr 1fr auto", gap:8, marginTop:6 }}>
          <select style={{...S.select, width:"auto"}} value={ekForm.zielTyp} onChange={e=>setEkForm(p=>({...p,zielTyp:e.target.value,zielId:""}))}>
            <option value="gruppe">Gruppe</option>
            <option value="person">Person</option>
          </select>
          <select style={S.select} value={ekForm.zielId} onChange={e=>setEkForm(p=>({...p,zielId:e.target.value}))}>
            <option value="">– auswählen –</option>
            {ekZielOptionen}
          </select>
          <input style={S.input} type="number" step="0.01" placeholder="Betrag" value={ekForm.betrag} onChange={e=>setEkForm(p=>({...p,betrag:e.target.value}))} />
          <button style={S.btn("#a0e4c8")} onClick={addEk}>+</button>
        </div>
      </div>

      <div style={{ display:"flex", gap:10, marginTop:6 }}>
        <button style={S.btnPrimary} onClick={()=>onSave(f)}>Speichern</button>
        {initial && <button style={S.btnDanger} onClick={()=>onDelete(initial.id)}>Löschen</button>}
      </div>
    </Modal>
  );
}

// HAUPT-APP
// ═══════════════════════════════════════════════════════════════════════════════
function App({ personen, setPersonen, reisen, setReisen, syncStatus, lastSaved, isAdmin, onPinManager, onLogout, pins, onSavePin, onClearPin }) {
  const [aktReiseId, setAktReiseId] = useState(reisen[0]?.id);
  const [tab, setTab] = useState("ausgaben");

  // Wenn reisen sich ändern (Firebase-Update) und aktReiseId nicht mehr existiert → auf erste Reise fallen
  useEffect(() => {
    if (reisen.length > 0 && !reisen.find(r => r.id === aktReiseId)) {
      setAktReiseId(reisen[0].id);
    }
  }, [reisen]);

  // Modals
  const [ausgabeModal,    setAusgabeModal]    = useState(null);
  const [reiseModal,      setReiseModal]      = useState(false);
  const [reiseEditModal,  setReiseEditModal]  = useState(null);
  const [gruppeModal,     setGruppeModal]     = useState(null);
  const [personModal,     setPersonModal]     = useState(null);
  const [einzahlungModal, setEinzahlungModal] = useState(null);
  const [shareModal,      setShareModal]      = useState(false);
  const [reisePickerOpen, setReisePickerOpen] = useState(false);

  // Filter
  const [filterBezahler, setFilterBezahler] = useState("alle");
  const [filterModus, setFilterModus] = useState("alle");

  const reise = reisen.find(r=>r.id===aktReiseId) || reisen[0] || {
    id:"", name:"", emoji:"", startDatum:"", endDatum:"", waehrung:"EUR",
    gruppen:[], ausgaben:[], anwesenheit:{}, einzahlungen:[]
  };
  const updReise = useCallback((fn) => {
    const next = reisen.map(r => r.id===aktReiseId ? fn(r) : r);
    setReisen(next);
  }, [aktReiseId, reisen, setReisen]);

  const { bilanzen, transfers, gruppenBilanz } = useMemo(()=>berechne(reise, personen), [reise, personen]);
  const reisePersonenIds = reise.personenIds || [];
  const allPInReise = personen.filter(p =>
    reise.gruppen.some(g=>g.mitglieder.includes(p.id)) ||
    reisePersonenIds.includes(p.id)
  );
  const reiseDays = getDays(reise.startDatum, reise.endDatum);

  // ── Personen-Farbe lookup ─────────────────────────────────────────────────
  const pFarbe = id => personen.find(p=>p.id===id)?.farbe || "#888";
  const pName  = id => { const p=personen.find(x=>x.id===id); return p ? `${p.name}` : id; };
  const gName  = id => reise.gruppen.find(g=>g.id===id)?.name || id;
  const gFarbe = id => reise.gruppen.find(g=>g.id===id)?.farbe || "#888";

  // ── Ausgaben CRUD ─────────────────────────────────────────────────────────
  function saveAusgabe(f) {
    const betrag = parseFloat(f.betrag)||0;
    if (!betrag || !f.beschreibung) return;
    if (ausgabeModal && ausgabeModal !== "new") {
      updReise(r=>({...r, ausgaben: r.ausgaben.map(a=>a.id===ausgabeModal.id ? {...f,id:a.id,betrag} : a)}));
    } else {
      updReise(r=>({...r, ausgaben:[...r.ausgaben, {...f,betrag,id:uid(),createdAt:Date.now()}]}));
    }
    setAusgabeModal(null);
  }
  function deleteAusgabe(id) { updReise(r=>({...r,ausgaben:r.ausgaben.filter(a=>a.id!==id)})); setAusgabeModal(null); }

  // ── Einzahlungen ──────────────────────────────────────────────────────────
  function saveEinzahlungen(personId, einzahlungen) {
    // Alle Einzahlungen dieser Person ersetzen
    updReise(r=>({
      ...r,
      einzahlungen: [
        ...r.einzahlungen.filter(e=>e.personId!==personId),
        ...einzahlungen.map(e=>({...e, personId}))
      ]
    }));
    setEinzahlungModal(null);
  }

  // ── Neue Reise ────────────────────────────────────────────────────────────
  const [reiseForm, setReiseForm] = useState({ name:"", emoji:"✈️", startDatum:"", endDatum:"", waehrung:"EUR" });
  function createReise() {
    if (!reiseForm.name) return;
    const nr = { id:uid(), ...reiseForm, gruppen:[], ausgaben:[], anwesenheit:{}, einzahlungen:[], personenIds:[] };
    setReisen([...reisen,nr]); setAktReiseId(nr.id); setReiseModal(false); setTab("ausgaben");
  }

  // ── Gruppen CRUD ──────────────────────────────────────────────────────────
  const [gForm, setGForm] = useState({ name:"", farbe:PALETTE[0], mitglieder:[] });
  function saveGruppe() {
    if (!gForm.name) return;
    if (gruppeModal && gruppeModal!=="new") {
      updReise(r=>({...r,gruppen:r.gruppen.map(g=>g.id===gruppeModal.id?{...g,...gForm}:g)}));
    } else {
      updReise(r=>({...r,gruppen:[...r.gruppen,{id:uid(),...gForm}]}));
    }
    setGruppeModal(null);
  }
  function deleteGruppe(id) { updReise(r=>({...r,gruppen:r.gruppen.filter(g=>g.id!==id)})); setGruppeModal(null); }

  // ── Personen CRUD ─────────────────────────────────────────────────────────
  const [pForm, setPForm] = useState({ name:"", nachname:"", farbe:PALETTE[0] });
  function savePerson() {
    if (!pForm.name) return;
    if (personModal && personModal!=="new") {
      setPersonen(personen.map(p=>p.id===personModal.id?{...p,...pForm}:p));
    } else {
      const newId = uid();
      const newPerson = {id:newId,...pForm};
      setPersonen([...personen, newPerson]);
      // Neue Person automatisch zur aktuellen Reise hinzufügen
      updReise(r=>({
        ...r,
        personenIds: [...(r.personenIds||[]), newId],
        anwesenheit: {...(r.anwesenheit||{}), [newId]: reiseDays}
      }));
    }
    setPersonModal(null);
  }

  function deletePerson(id) {
    setPersonen(personen.filter(p => p.id !== id));
    setReisen(reisen.map(r => ({
      ...r,
      personenIds:  (r.personenIds  || []).filter(pid => pid !== id),
      gruppen:      (r.gruppen      || []).map(g => ({...g, mitglieder: g.mitglieder.filter(m => m !== id)})),
      einzahlungen: (r.einzahlungen || []).filter(e => e.personId !== id),
      ausgaben:     (r.ausgaben     || []).map(a => ({
        ...a,
        bezahlerId: a.bezahlerId === id ? "" : a.bezahlerId,
        verteilungsZiele: (a.verteilungsZiele || []).filter(z => z !== id),
      })),
      anwesenheit: Object.fromEntries(Object.entries(r.anwesenheit || {}).filter(([pid]) => pid !== id)),
    })));
    setPersonModal(null);
  }

  // ── Ausgaben filtern ──────────────────────────────────────────────────────
  const filteredAusgaben = reise.ausgaben.filter(a=>{
    if (filterBezahler!=="alle" && a.bezahlerId!==filterBezahler) return false;
    if (filterModus!=="alle" && a.verteilungsModus!==filterModus) return false;
    return true;
  }).sort((a,b)=>{
    const dateDiff = b.datum.localeCompare(a.datum);
    if (dateDiff !== 0) return dateDiff;
    // Innerhalb eines Tages: neueste Eingabe oben (createdAt absteigend)
    return (b.createdAt||0) - (a.createdAt||0);
  });

  const totalAusgaben = reise.ausgaben.reduce((s,a)=>s+(parseFloat(a.betrag)||0),0);
  const totalEingezahlt = reise.einzahlungen.reduce((s,e)=>s+(parseFloat(e.betrag)||0),0);

  // ── STYLING ───────────────────────────────────────────────────────────────

  const MODUS_LABELS = { alle:"Alle", anwesende:"Tagesweise", gruppen:"Gruppen", personen:"Personen" };
  const MODUS_COLORS = { alle:"#888", anwesende:"#5A9BE8", gruppen:"#5AC8A0", personen:"#E8C05A" };

  const NAV_ITEMS = [
    { key:"ausgaben",   icon:"💳", label:"Ausgaben"   },
    { key:"abrechnung", icon:"⚖️", label:"Abrechnung" },
    { key:"statistik",  icon:"📊", label:"Statistik"  },
    { key:"gruppen",    icon:"👥", label:"Gruppen"    },
    { key:"personen",   icon:"🧑", label:"Personen"   },
  ];

  // FAB-Aktion je Tab
  const fabAction = () => {
    if (tab==="ausgaben")   setAusgabeModal("new");
    if (tab==="gruppen")    { setGForm({name:"",farbe:PALETTE[colorIdx%PALETTE.length],mitglieder:[]}); setGruppeModal("new"); }
    if (tab==="personen")   { setPForm({name:"",nachname:"",farbe:nextColor()}); setPersonModal("new"); }
  };
  const fabLabel = { ausgaben:"+ Ausgabe", gruppen:"+ Gruppe", personen:"+ Person" };

  return (
    <div style={{ minHeight:"100vh", background:"linear-gradient(135deg,#0d0f1a 0%,#111523 60%,#0a1020 100%)",
      fontFamily:"'Segoe UI',system-ui,sans-serif", color:"#c8cad8", paddingBottom:80 }}>

      
      <div style={{ background:"linear-gradient(90deg,#1a1d30,#141728)", borderBottom:"1px solid #2a2d42",
        padding:"12px 16px", position:"sticky", top:0, zIndex:200 }}>

                    {filterModus!=="alle" && <span style={{ color: MCOLORS[filterModus]||"#888", marginLeft:6 }}>&middot; {MNAMES[filterModus]||filterModus}</span>}
                  </div>

          const gruppenTransfers = (()=>{
            // Gruppen-Bilanz: Eingezahlt - Anteil je Gruppe
            const gb = gruppenBilanz.map(g => ({ ...g, rest: g.bilanz }));
            const gl = gb.filter(g => g.rest >  0.01).map(g => ({...g}));
            const sc = gb.filter(g => g.rest < -0.01).map(g => ({...g, rest: Math.abs(g.rest)}));
            const result = [];
            let gi=0, si=0;
            while (gi<gl.length && si<sc.length) {
              const b = Math.min(gl[gi].rest, sc[si].rest);
              if (b > 0.01) result.push({ vonId:sc[si].id, von:sc[si].name, vonFarbe:sc[si].farbe, anId:gl[gi].id, an:gl[gi].name, anFarbe:gl[gi].farbe, betrag:b });
              gl[gi].rest -= b; sc[si].rest -= b;
              if (gl[gi].rest < 0.01) gi++;
              if (sc[si].rest < 0.01) si++;
            }
            return result;
          })();

          const maxBar = Math.max(...gruppenBilanz.map(g=>Math.max(g.gesamtAnteil, g.gesamtEingezahlt)), 1);

                  </div>
                  <div style={{ color:"#444", fontSize:20 }}>→</div>
                  
                  <div style={{ display:"flex", alignItems:"center", gap:6, flex:1, minWidth:0 }}>
                    <div style={{ width:32, height:32, borderRadius:8, background:t.anFarbe+"33",

                      {t.an.slice(0,2)}
                    </div>
                    <div>
                      <div style={{ fontSize:10, color:"#555" }}>AN GRUPPE</div>
                      <div style={{ fontWeight:700, color:"#7eb8f7", fontSize:14 }}>{t.an}</div>
                    </div>
                  </div>
                  <div style={{ fontWeight:900, fontSize:20, color:"#E8C05A", whiteSpace:"nowrap", flexShrink:0 }}>
                    {fmt(t.betrag)}
                  </div>
                </div>
              ))
            }

              <span style={{ fontSize:16 }}>💶</span>
              <span style={{ fontWeight:800, fontSize:15, color:"#e0e2f0" }}>Einzahlungsstatus</span>
              <span style={{ marginLeft:"auto", fontSize:12, color:"#555" }}>

              const hatNichts   = g.gesamtEingezahlt < 0.01;

              const statusIcon  = hatNichts?"⚠️": istSchuldner?"🔴":"✅";
              const statusText  = hatNichts?"Noch nichts eingezahlt":
                istSchuldner?`Noch ${fmt(Math.abs(g.bilanz))} offen`:

                        {mitglieder.map((p,i)=>{
                          const pb = bilanzen.find(b=>b.id===p.id);
                          const total = (pb?.eingezahlt)||0;
                          const manuell = (pb?.manuellEingezahlt)||0;
                          const ausgBez = (pb?.bezahltAusgaben)||0;

                            <div key={p.id} style={{ display:"flex", alignItems:"center", gap:4,

                          borderRadius:20, padding:"2px 8px", fontSize:11, cursor:"pointer", fontWeight:600 }}>

                      </div>
                    </div>
                    
                    <div style={{ background:statusFarbe+"22", border:`1px solid ${statusFarbe}44`,
                      borderRadius:10, padding:"6px 10px", textAlign:"center", flexShrink:0 }}>
                      <div style={{ fontSize:10, color:statusFarbe, fontWeight:700 }}>
                        {istSchuldner?"SCHULDEN": hatNichts?"OFFEN":"GUTHABEN"}
                      </div>
                      <div style={{ fontSize:16, fontWeight:900, color:statusFarbe }}>
                        {g.bilanz>0?"+":""}{fmt(g.bilanz)}
                      </div>
                    </div>
                  </div>
                  
                  <div style={{ position:"relative", height:16, background:"#0e1020", borderRadius:8, overflow:"hidden", marginBottom:6 }}>
                    <div style={{ position:"absolute", left:0, top:0, height:"100%",
                      background:g.farbe+"33", borderRadius:8,
                      width:`${(g.gesamtAnteil/maxBar)*100}%` }}/>
                    <div style={{ position:"absolute", left:0, top:0, height:"100%",
                      background:g.farbe, borderRadius:8,
                      width:`${Math.min(100,(g.gesamtEingezahlt/maxBar)*100)}%` }}/>
                  </div>
                  <div style={{ display:"flex", justifyContent:"space-between", fontSize:11 }}>
                    <span style={{ color:"#7eb8f7", fontWeight:700 }}>Eingezahlt: {fmt(g.gesamtEingezahlt)}</span>
                    <span style={{ color:"#E8C05A", fontWeight:700 }}>Anteil: {fmt(g.gesamtAnteil)}</span>
                  </div>
                  <div style={{ fontSize:11, color:statusFarbe, fontWeight:600, marginTop:5 }}>
                    {statusIcon} {statusText}

                </div>

          </div>

          
          <h3 style={S.h3}>Personen-Detail</h3>
          {bilanzen.map(p=>{

// ─── SHARE MODAL ─────────────────────────────────────────────────────────────
function ShareModal({ open, onClose, personen, reisen }) {
  const [copied, setCopied] = useState(false);
  const [imported, setImported] = useState(false);
  const [importError, setImportError] = useState(false);
  const [importText, setImportText] = useState("");

  const shareUrl = useMemo(() => {
    if (!open) return "";
    const encoded = encodeState(personen, reisen);
    if (!encoded) return "";
    const url = new URL(window.location.href.split("#")[0]);
    url.hash = `d=${encoded}`;
    return url.toString();
  }, [open, personen, reisen]);

  const sizeKB = Math.round(shareUrl.length / 1024 * 10) / 10;

  function copyUrl() {
    navigator.clipboard.writeText(shareUrl).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 2500);
    });
  }

  function doImport() {
    setImportError(false);
    // Versuche URL oder rohen Base64-String
    let decoded = null;
    try {
      const hash = new URL(importText).hash.slice(1);
      const params = new URLSearchParams(hash);
      decoded = decodeState(params.get("d"));
    } catch {
      decoded = decodeState(importText.trim());
    }
    if (decoded?.personen && decoded?.reisen) {
      // Seite mit neuem State neu laden
      const encoded = encodeState(decoded.personen, decoded.reisen);
      window.location.hash = `d=${encoded}`;
      window.location.reload();
    } else {
      setImportError(true);
    }
  }

  return (
    <Modal open={open} onClose={onClose} title="🔗 Daten teilen & importieren" width={540}>
      
      <div style={{ background:"#0e1020", borderRadius:10, padding:12, marginBottom:18, fontSize:13, color:"#888", lineHeight:1.6 }}>
        Alle Daten stecken im Link. Wer eine Änderung macht, drückt <strong style={{color:"#7eb8f7"}}>Link kopieren</strong> und schickt ihn in die Gruppe. Die anderen öffnen den Link – fertig.
      </div>

      
      <div style={S.row}>
        <label style={S.label}>Aktueller Stand als Link</label>
        <div style={{ display:"flex", gap:8 }}>
          <input readOnly style={{...S.input, flex:1, fontSize:11, color:"#555", cursor:"text"}}
            value={shareUrl} onClick={e=>e.target.select()} />
          <button style={{
            ...S.btnPrimary, padding:"9px 16px", whiteSpace:"nowrap", flexShrink:0,
            background: copied
              ? "linear-gradient(90deg,#2a6a3a,#3a8a4a)"
              : "linear-gradient(90deg,#4a7fd4,#5aabda)",
          }} onClick={copyUrl}>
            {copied ? "✓ Kopiert!" : "Link kopieren"}
          </button>
        </div>
        <div style={{ fontSize:11, color:"#555", marginTop:5 }}>
          Linkgröße: {sizeKB} KB
        </div>
      </div>

      <div style={S.sep}/>

      
      <div style={S.row}>
        <label style={S.label}>Link von jemand anderem importieren</label>
        <textarea style={{...S.input, height:72, resize:"vertical", fontSize:12}}
          placeholder="Empfangenen Link hier einfügen…"
          value={importText} onChange={e=>setImportText(e.target.value)}/>
        {importError && (
          <div style={{ fontSize:12, color:"#e85a5a", marginTop:5 }}>
            ⚠️ Ungültiger Link – bitte den vollständigen Link einfügen.
          </div>
        )}
      </div>
      <button style={{...S.btnPrimary, background:"linear-gradient(90deg,#7a4fd4,#9a6aea)"}}
        onClick={doImport} disabled={!importText.trim()}>
        Importieren & neu laden
      </button>

      <div style={{ fontSize:11, color:"#444", marginTop:14 }}>
        Tipp: Speichert den Link als Lesezeichen – so könnt ihr jederzeit zur aktuellen Version zurück.
      </div>
    </Modal>
  );
}

// ─── STATISTIK TAB ───────────────────────────────────────────────────────────
function StatistikTab({ reise, alleReisen, bilanzen, gruppenBilanz, allPersonen, fmt }) {
  const ausgaben = reise.ausgaben || [];
  const total = ausgaben.reduce((s,a)=>s+(parseFloat(a.betrag)||0),0);
  const nPersonen = bilanzen.length || 1;
  const kostenProPerson = total / nPersonen;

  // ── Reisen-Vergleich ──────────────────────────────────────────────────────
  const reisenVergleich = alleReisen.map(r => {
    const rTotal = (r.ausgaben||[]).reduce((s,a)=>s+(parseFloat(a.betrag)||0),0);
    const rPersonen = [...new Set([
      ...(r.gruppen||[]).flatMap(g=>g.mitglieder||[]),
      ...(r.personenIds||[])
    ])];
    const rN = Math.max(rPersonen.length, 1);
    // Anzahl Tage
    let rTage = 1;
    if (r.startDatum && r.endDatum) {
      const diff = new Date(r.endDatum+"T12:00:00") - new Date(r.startDatum+"T12:00:00");
      rTage = Math.max(1, Math.round(diff / (1000*60*60*24)) + 1);
    }
    return {
      id:r.id, name:r.name, emoji:r.emoji||"✈️",
      total:rTotal, perPerson:rTotal/rN, perPersonTag:(rTotal/rN)/rTage,
      n:rN, tage:rTage, isAktiv:r.id===reise.id
    };
  }).sort((a,b)=>b.perPerson-a.perPerson);

  // ── Ausgaben pro Person (wer hat wie viel bezahlt) ────────────────────────
  const perPersonMap = {};
  ausgaben.forEach(a => {
    if (a.bezahlerTyp==="person") {
      perPersonMap[a.bezahlerId] = (perPersonMap[a.bezahlerId]||0)+(parseFloat(a.betrag)||0);
    }
  });
  const perPerson = Object.entries(perPersonMap).map(([id,val]) => {
    const p = allPersonen.find(x=>x.id===id);
    const g = reise.gruppen?.find(x=>x.id===id);
    return { id, name:p?.name||g?.name||id, farbe:p?.farbe||g?.farbe||"#888", val };
  }).sort((a,b)=>b.val-a.val);

  // ── Anteil pro Person (was sie schulden/bekommen) ─────────────────────────
  const anteilPerPerson = bilanzen.map(p=>({
    id:p.id, name:p.name, farbe:p.farbe,
    anteil:p.anteil, eingezahlt:p.eingezahlt, bilanz:p.bilanz
  })).sort((a,b)=>b.anteil-a.anteil);

  // ── Ausgaben pro Tag ──────────────────────────────────────────────────────
  const tagesMap = {};
  ausgaben.forEach(a => { tagesMap[a.datum]=(tagesMap[a.datum]||0)+(parseFloat(a.betrag)||0); });
  const tagesSorted = Object.entries(tagesMap).sort(([a],[b])=>a.localeCompare(b));

  // ── Modus-Anteile ─────────────────────────────────────────────────────────
  const modusMap = {};
  ausgaben.forEach(a=>{ modusMap[a.verteilungsModus]=(modusMap[a.verteilungsModus]||0)+(parseFloat(a.betrag)||0); });
  const modusEntries = Object.entries(modusMap).sort((a,b)=>b[1]-a[1]);
  const MODUS_FARBEN = {alle:"#7eb8f7",anwesende:"#5AC8A0",gruppen:"#E8C05A",personen:"#E85A8A"};
  const MODUS_NAMEN  = {alle:"Alle gleich",anwesende:"Tagesweise",gruppen:"Gruppen",personen:"Personen"};

  // ── SVG-Komponenten ───────────────────────────────────────────────────────
  function BarChart({ items, maxVal, height=28, gap=10 }) {
    return (
      <div>
        {items.map((item,i)=>(
          <div key={item.id||i} style={{marginBottom:gap}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
              <span style={{fontSize:12,color:"#c8cad8",fontWeight:600}}>{item.name}</span>
              <span style={{fontSize:12,color:item.farbe,fontWeight:700}}>{fmt(item.val)}</span>
            </div>
            <div style={{height,background:"#0e1020",borderRadius:height/2,overflow:"hidden"}}>
              <div style={{height:"100%",borderRadius:height/2,
                background:`linear-gradient(90deg,${item.farbe}cc,${item.farbe}66)`,
                width:`${Math.max(2,(item.val/maxVal)*100)}%`}}>
              </div>
            </div>
          </div>
        ))}
      </div>
    );
  }

  function DonutChart({slices,size=140,thickness=28}) {
    const r=(size/2)-thickness/2;
    const circ=2*Math.PI*r;
    const totalVal=slices.reduce((s,x)=>s+x.val,0);
    let offset=0;
    const paths=slices.map((s,i)=>{
      const frac=totalVal>0?s.val/totalVal:0;
      const dash=frac*circ; const gap=circ-dash;
      const el=<circle key={i} cx={size/2} cy={size/2} r={r} fill="none" stroke={s.farbe}
        strokeWidth={thickness} strokeDasharray={`${dash} ${gap}`} strokeDashoffset={-offset}
        style={{transform:"rotate(-90deg)",transformOrigin:"50% 50%"}}/>;
      offset+=dash; return el;
    });
    return (
      <svg width={size} height={size} style={{display:"block",margin:"0 auto"}}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#0e1020" strokeWidth={thickness}/>
        {paths}
        <text x={size/2} y={size/2-6} textAnchor="middle" fill="#e0e2f0" fontSize={13} fontWeight={800}>{slices.length}</text>
        <text x={size/2} y={size/2+12} textAnchor="middle" fill="#666" fontSize={10}>Modi</text>
      </svg>
    );
  }

  function LineChart({data,width=320,height=120}) {
    if (data.length<2) return <div style={{color:"#555",fontSize:13,textAlign:"center",padding:20}}>Zu wenig Daten</div>;
    const vals=data.map(([,v])=>v);
    const maxV=Math.max(...vals,1);
    const padL=8,padR=8,padT=12,padB=28;
    const w=width-padL-padR; const h=height-padT-padB;
    const pts=data.map(([,v],i)=>[padL+(i/(data.length-1))*w, padT+(1-v/maxV)*h]);
    const polyline=pts.map(([x,y])=>`${x},${y}`).join(" ");
    const area=`${pts[0][0]},${padT+h} ${polyline} ${pts[pts.length-1][0]},${padT+h}`;
    return (
      <svg width="100%" viewBox={`0 0 ${width} ${height}`} style={{overflow:"visible"}}>
        {[0,.5,1].map(f=><line key={f} x1={padL} x2={padL+w} y1={padT+f*h} y2={padT+f*h} stroke="#1e2235" strokeWidth={1}/>)}
        <polygon points={area} fill="#7eb8f733"/>
        <polyline points={polyline} fill="none" stroke="#7eb8f7" strokeWidth={2.5} strokeLinejoin="round" strokeLinecap="round"/>
        {pts.map(([x,y],i)=>(
          <g key={i}>
            <circle cx={x} cy={y} r={3.5} fill="#7eb8f7" stroke="#0d0f1a" strokeWidth={1.5}/>
            <text x={x} y={padT+h+16} textAnchor="middle" fill="#555" fontSize={9}>
              {new Date(data[i][0]+"T12:00:00").toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})}
            </text>
          </g>
        ))}
      </svg>
    );
  }

  const card = {background:"#1a1d2e",border:"1px solid #252840",borderRadius:14,padding:18,marginBottom:14};
  const maxReisenPP = Math.max(...reisenVergleich.map(r=>r.perPerson),1);
  const maxReisenPPT = Math.max(...reisenVergleich.map(r=>r.perPersonTag),1);

  return (
    <div>
      {/* ── Kennzahlen ───────────────────────────────────────────────────── */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
        {[
          ["Gesamtausgaben",fmt(total),"#7eb8f7"],
          ["Ø pro Person",fmt(kostenProPerson),"#a0e4c8"],
          ["Teuerste Ausgabe",fmt(Math.max(...ausgaben.map(a=>parseFloat(a.betrag)||0),0)),"#E8C05A"],
          ["Buchungen",ausgaben.length+" Einträge","#E85A8A"],
        ].map(([l,v,c])=>(
          <div key={l} style={{background:"#1a1d2e",border:"1px solid #252840",borderRadius:12,padding:"12px 14px"}}>
            <div style={{fontSize:10,color:"#555",fontWeight:700,letterSpacing:.5,marginBottom:3}}>{l.toUpperCase()}</div>
            <div style={{fontSize:17,fontWeight:800,color:c}}>{v}</div>
          </div>
        ))}
      </div>

      {/* ── Reisen-Vergleich Kosten/Person ───────────────────────────────── */}
      {alleReisen.length > 1 && (
        <div style={card}>
          <div style={{fontWeight:700,color:"#e0e2f0",marginBottom:4,fontSize:14}}>🌍 Kosten/Person im Reisen-Vergleich</div>
          <div style={{fontSize:11,color:"#555",marginBottom:14}}>Ø Kosten je Teilnehmer – alle Reisen im Vergleich</div>
          {reisenVergleich.map((r,i)=>{
            const barColor = r.isAktiv ? "#7eb8f7" : "#3a3d58";
            const textColor = r.isAktiv ? "#7eb8f7" : "#888";
            return (
              <div key={r.id} style={{marginBottom:12}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <span style={{fontSize:14}}>{r.emoji}</span>
                    <span style={{fontSize:13,color:textColor,fontWeight:r.isAktiv?800:500}}>{r.name}</span>
                    {r.isAktiv && <span style={{background:"#7eb8f722",border:"1px solid #7eb8f744",color:"#7eb8f7",borderRadius:10,padding:"1px 7px",fontSize:10,fontWeight:700}}>aktuell</span>}
                    <span style={{fontSize:11,color:"#444"}}>{r.n} Pers.</span>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontSize:14,fontWeight:800,color:textColor}}>{fmt(r.perPerson)}</div>
                    <div style={{fontSize:10,color:"#5AC8A0",fontWeight:600}}>{fmt(r.perPersonTag)}<span style={{color:"#444",fontWeight:400}}> /Tag</span></div>
                    <div style={{fontSize:10,color:"#444"}}>{r.tage} Tage · {r.n} Pers. · {fmt(r.total)}</div>
                  </div>
                </div>
                <div style={{height:8,background:"#0e1020",borderRadius:4,overflow:"hidden",marginBottom:3}}>
                  <div style={{height:"100%",borderRadius:4,
                    background:r.isAktiv?"linear-gradient(90deg,#4a7fd4,#7eb8f7)":barColor,
                    width:`${(r.perPerson/maxReisenPP)*100}%`}}/>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:6}}>
                  <div style={{height:5,background:"#0e1020",borderRadius:3,overflow:"hidden",flex:1}}>
                    <div style={{height:"100%",borderRadius:3,
                      background:r.isAktiv?"linear-gradient(90deg,#2a8a5a,#5AC8A0)":"#2a4a3a",
                      width:`${(r.perPersonTag/maxReisenPPT)*100}%`}}/>
                  </div>
                  <span style={{fontSize:9,color:"#444",whiteSpace:"nowrap",flexShrink:0}}>pro Tag</span>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* ── Ausgaben pro Tag ─────────────────────────────────────────────── */}
      <div style={card}>
        <div style={{fontWeight:700,color:"#e0e2f0",marginBottom:14,fontSize:14}}>📅 Ausgaben pro Tag</div>
        <LineChart data={tagesSorted} width={340} height={130}/>
      </div>

      {/* ── Ausgaben pro Person (bezahlt) ────────────────────────────────── */}
      <div style={card}>
        <div style={{fontWeight:700,color:"#e0e2f0",marginBottom:4,fontSize:14}}>💳 Bezahlt von</div>
        <div style={{fontSize:11,color:"#555",marginBottom:14}}>Wer hat wie viel vorgelegt?</div>
        <BarChart items={perPerson} maxVal={perPerson[0]?.val||1} height={28} gap={10}/>
      </div>

      {/* ── Anteil pro Person ────────────────────────────────────────────── */}
      <div style={card}>
        <div style={{fontWeight:700,color:"#e0e2f0",marginBottom:4,fontSize:14}}>👤 Kostenanteil pro Person</div>
        <div style={{fontSize:11,color:"#555",marginBottom:14}}>Was schuldet / bekommt jede Person zurück?</div>
        {anteilPerPerson.map(p=>{
          const pos = p.bilanz >= 0;
          const maxAnteil = Math.max(...anteilPerPerson.map(x=>x.anteil),1);
          return (
            <div key={p.id} style={{marginBottom:14}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                <div style={{display:"flex",alignItems:"center",gap:6}}>
                  <div style={{width:10,height:10,borderRadius:"50%",background:p.farbe,flexShrink:0}}/>
                  <span style={{fontSize:13,color:"#c8cad8",fontWeight:600}}>{p.name}</span>
                </div>
                <div style={{textAlign:"right"}}>
                  <span style={{fontSize:13,fontWeight:700,color:"#E8C05A"}}>{fmt(p.anteil)}</span>
                  <span style={{fontSize:11,color:pos?"#5AC8A0":"#e85a5a",marginLeft:8,fontWeight:700}}>
                    {pos?"+":""}{fmt(p.bilanz)}
                  </span>
                </div>
              </div>
              <div style={{position:"relative",height:16,background:"#0e1020",borderRadius:8,overflow:"hidden"}}>
                <div style={{position:"absolute",left:0,top:0,height:"100%",
                  background:p.farbe+"55",borderRadius:8,
                  width:`${(p.anteil/maxAnteil)*100}%`}}/>
                <div style={{position:"absolute",left:0,top:0,height:"100%",
                  background:p.farbe,borderRadius:8,
                  width:`${(p.eingezahlt/maxAnteil)*100}%`,maxWidth:"100%"}}/>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#444",marginTop:2}}>
                <span>Eingezahlt: {fmt(p.eingezahlt)}</span>
                <span>Soll: {fmt(p.anteil)}</span>
              </div>
            </div>
          );
        })}
      </div>

      {/* ── Verteilungsmodus ─────────────────────────────────────────────── */}
      <div style={card}>
        <div style={{fontWeight:700,color:"#e0e2f0",marginBottom:14,fontSize:14}}>🎯 Verteilung nach Modus</div>
        <div style={{display:"flex",alignItems:"center",gap:20}}>
          <div style={{flexShrink:0}}>
            <DonutChart slices={modusEntries.map(([k,v])=>({farbe:MODUS_FARBEN[k]||"#888",val:v}))} size={130} thickness={26}/>
          </div>
          <div style={{flex:1}}>
            {modusEntries.map(([k,v])=>(
              <div key={k} style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <div style={{display:"flex",alignItems:"center",gap:7}}>
                  <div style={{width:10,height:10,borderRadius:3,background:MODUS_FARBEN[k]||"#888",flexShrink:0}}/>
                  <span style={{fontSize:12,color:"#c8cad8"}}>{MODUS_NAMEN[k]||k}</span>
                </div>
                <div style={{textAlign:"right"}}>
                  <span style={{fontSize:12,fontWeight:700,color:MODUS_FARBEN[k]||"#888"}}>{fmt(v)}</span>
                  <span style={{fontSize:11,color:"#555",marginLeft:6}}>{((v/total)*100).toFixed(0)}%</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* ── Top Ausgaben pro Person ───────────────────────────────────────── */}
      <div style={card}>
        <div style={{fontWeight:700,color:"#e0e2f0",marginBottom:4,fontSize:14}}>🏆 Top Ausgaben pro Person</div>
        <div style={{fontSize:11,color:"#555",marginBottom:14}}>Die größten Einzelpositionen je Zahler</div>
        {allPersonen.filter(p=>(reise.gruppen||[]).some(g=>g.mitglieder?.includes(p.id))||(reise.personenIds||[]).includes(p.id)).map(person=>{
          const pAusgaben = ausgaben
            .filter(a=>a.bezahlerTyp==="person" && a.bezahlerId===person.id)
            .sort((a,b)=>(parseFloat(b.betrag)||0)-(parseFloat(a.betrag)||0))
            .slice(0,3);
          if (pAusgaben.length===0) return null;
          const pTotal = pAusgaben.reduce((s,a)=>s+(parseFloat(a.betrag)||0),0);
          return (
            <div key={person.id} style={{marginBottom:16}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                <div style={{width:10,height:10,borderRadius:"50%",background:person.farbe,flexShrink:0}}/>
                <span style={{fontWeight:700,color:"#e0e2f0",fontSize:13}}>{person.name}</span>
                <span style={{fontSize:11,color:"#555",marginLeft:"auto"}}>Top 3 von {fmt(ausgaben.filter(a=>a.bezahlerId===person.id).reduce((s,a)=>s+(parseFloat(a.betrag)||0),0))} gesamt</span>
              </div>
              {pAusgaben.map((a,i)=>{
                const pct = ((parseFloat(a.betrag)||0)/total*100).toFixed(1);
                return (
                  <div key={a.id} style={{display:"flex",alignItems:"center",gap:10,marginBottom:6,
                    background:"#0e1020",borderRadius:8,padding:"7px 10px"}}>
                    <div style={{width:18,height:18,borderRadius:"50%",background:"#252840",
                      display:"flex",alignItems:"center",justifyContent:"center",
                      fontSize:10,color:"#888",flexShrink:0}}>{i+1}</div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:12,fontWeight:600,color:"#e0e2f0",
                        overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.beschreibung}</div>
                      <div style={{height:3,background:"#1e2235",borderRadius:2,marginTop:3}}>
                        <div style={{width:`${pct}%`,height:"100%",background:person.farbe,borderRadius:2}}/>
                      </div>
                    </div>
                    <div style={{textAlign:"right",flexShrink:0}}>
                      <div style={{fontSize:13,fontWeight:800,color:person.farbe}}>{fmt(parseFloat(a.betrag))}</div>
                      <div style={{fontSize:10,color:"#555"}}>{pct}%</div>
                    </div>
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>
    </div>
  );
}

                style={{ background:"#e85a5a", border:"none", color:"#fff",
                  borderRadius:10, padding:"10px 16px", cursor:"pointer", fontWeight:700, fontSize:13 }}>
                Wirklich löschen?
              </button>
          }
        </div>
      </div>
    </div>
  );
}

function PinScreen({ reisen, pins, onUnlock }) {
  const [selectedReise, setSelectedReise] = useState(reisen[0]?.id || "");
  const [pin, setPin] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  async function handleLogin() {
    if (!pin) return;
    setLoading(true);
    setError("");
    const hashed = await hashPin(pin);
    // Admin-Login
    if (pins[ADMIN_PIN_KEY] && hashed === pins[ADMIN_PIN_KEY]) {
      onUnlock("admin", null);
      return;
    }
    // Reise-Login
    if (pins[selectedReise] && hashed === pins[selectedReise]) {
      onUnlock("reise", selectedReise);
      return;
    }
    // Fallback: keine PINs gesetzt → Admin-Zugang mit "admin"
    if (!pins[ADMIN_PIN_KEY] && pin === "admin") {
      onUnlock("admin", null);
      return;
    }
    setLoading(false);
    setError("Falsche PIN – bitte erneut versuchen");
    setPin("");
  }

  function handleKey(e) { if (e.key === "Enter") handleLogin(); }

  return (
    <div style={{ position:"fixed", inset:0, background:"linear-gradient(135deg,#0d0f1a,#111523)",
      display:"flex", alignItems:"center", justifyContent:"center", padding:20 }}>
      <div style={{ background:"#1a1d2e", border:"1px solid #252840", borderRadius:20,
        padding:32, width:"min(380px,96vw)", textAlign:"center" }}>
        <div style={{ fontSize:48, marginBottom:8 }}>🔐</div>
        <h2 style={{ color:"#e0e2f0", fontSize:20, fontWeight:800, marginBottom:4 }}>Urlaubs-Abrechnung</h2>
        <p style={{ color:"#555", fontSize:13, marginBottom:24 }}>Bitte PIN eingeben</p>

        {reisen.length > 1 && (
          <div style={{ marginBottom:16 }}>
            <label style={{ display:"block", fontSize:11, color:"#888", fontWeight:700, marginBottom:6, textTransform:"uppercase", letterSpacing:.5 }}>Reise auswählen</label>
            <select value={selectedReise} onChange={e=>setSelectedReise(e.target.value)}
              style={{ background:"#0e1020", border:"1px solid #2a2d42", color:"#e0e2f0",
                borderRadius:10, padding:"10px 14px", width:"100%", fontSize:14 }}>
              {reisen.map(r => <option key={r.id} value={r.id}>{r.emoji} {r.name}</option>)}
            </select>
          </div>
        )}

        <div style={{ marginBottom:16 }}>
          <label style={{ display:"block", fontSize:11, color:"#888", fontWeight:700, marginBottom:6, textTransform:"uppercase", letterSpacing:.5 }}>PIN</label>
          <input type="password" inputMode="numeric" maxLength={8}
            value={pin} onChange={e=>setPin(e.target.value.replace(/\D/g,""))} onKeyDown={handleKey}
            placeholder="••••"
            style={{ background:"#0e1020", border:"1px solid #2a2d42", color:"#e0e2f0",
              borderRadius:10, padding:"12px 16px", width:"100%", fontSize:22, textAlign:"center",
              letterSpacing:8, boxSizing:"border-box" }} />
        </div>

        {error && <div style={{ color:"#e85a5a", fontSize:13, marginBottom:12, fontWeight:600 }}>{error}</div>}

        <button onClick={handleLogin} disabled={loading || !pin}
          style={{ background:"linear-gradient(90deg,#4a7fd4,#5aabda)", border:"none",
            color:"#fff", borderRadius:12, padding:"12px 0", width:"100%",
            cursor: pin?"pointer":"not-allowed", fontWeight:800, fontSize:15,
            opacity: pin?1:0.5 }}>
          {loading ? "Prüfe…" : "Anmelden"}
        </button>

        {!pins[ADMIN_PIN_KEY] && (
          <p style={{ color:"#333", fontSize:11, marginTop:16 }}>
            Noch keine Admin-PIN gesetzt → PIN "admin" eingeben
          </p>
        )}
      </div>
    </div>
  );
}

function PinManager({ reisen, pins, onSave, onClose }) {
  const [adminPin,    setAdminPin]    = useState("");
  const [adminPin2,   setAdminPin2]   = useState("");
  const [reisePins,   setReisePins]   = useState({});
  const [reisePins2,  setReisePins2]  = useState({});
  const [saving,      setSaving]      = useState(false);
  const [saved,       setSaved]       = useState(false);
  const [errors,      setErrors]      = useState({});

  async function handleSave() {
    const errs = {};
    if (adminPin && adminPin !== adminPin2) errs.admin = "PINs stimmen nicht überein";
    if (adminPin && adminPin.length < 4)   errs.adminLen = "Min. 4 Stellen";
    reisen.forEach(r => {
      if (reisePins[r.id] && reisePins[r.id] !== reisePins2[r.id]) errs[r.id] = "PINs stimmen nicht überein";
      if (reisePins[r.id] && reisePins[r.id].length < 4) errs[r.id+"len"] = "Min. 4 Stellen";
    });
    if (Object.keys(errs).length > 0) { setErrors(errs); return; }

    setSaving(true);
    const newPins = { ...pins };
    if (adminPin) newPins[ADMIN_PIN_KEY] = await hashPin(adminPin);
    for (const r of reisen) {
      if (reisePins[r.id]) newPins[r.id] = await hashPin(reisePins[r.id]);
    }
    await onSave(newPins);
    setSaving(false);
    setSaved(true);
    setTimeout(() => { setSaved(false); onClose(); }, 1200);
  }

  const inp = { background:"#0e1020", border:"1px solid #2a2d42", color:"#e0e2f0",
    borderRadius:8, padding:"9px 12px", width:"100%", fontSize:14, boxSizing:"border-box" };
  const lbl = { display:"block", fontSize:11, color:"#888", fontWeight:700,
    marginBottom:5, textTransform:"uppercase", letterSpacing:.5 };

  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(8,10,20,0.85)",
      display:"flex", alignItems:"center", justifyContent:"center", zIndex:2000, padding:16 }}
      onClick={onClose}>
      <div style={{ background:"#181b2c", border:"1px solid #2a2d42", borderRadius:18,
        padding:28, width:"min(480px,96vw)", maxHeight:"90vh", overflowY:"auto" }}
        onClick={e=>e.stopPropagation()}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20 }}>
          <h3 style={{ margin:0, color:"#e8eaf0", fontSize:17 }}>🔐 PIN-Verwaltung</h3>
          <button onClick={onClose} style={{ background:"none", border:"none", color:"#666", fontSize:24, cursor:"pointer" }}>×</button>
        </div>

        <div style={{ background:"#0e1020", borderRadius:10, padding:12, marginBottom:20, fontSize:12, color:"#555", lineHeight:1.6 }}>
          Leer lassen = PIN nicht ändern. Min. 4 Stellen (nur Ziffern).
        </div>

        <div style={{ marginBottom:20 }}>
          <div style={{ fontWeight:700, color:"#7eb8f7", marginBottom:12, fontSize:14 }}>👑 Admin-PIN</div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
            <div><label style={lbl}>Neue Admin-PIN</label>
              <input style={inp} type="password" inputMode="numeric" maxLength={8} placeholder="••••"
                value={adminPin} onChange={e=>setAdminPin(e.target.value.replace(/\D/g,""))} /></div>
            <div><label style={lbl}>Wiederholen</label>
              <input style={inp} type="password" inputMode="numeric" maxLength={8} placeholder="••••"
                value={adminPin2} onChange={e=>setAdminPin2(e.target.value.replace(/\D/g,""))} /></div>
          </div>
          {errors.admin && <div style={{ color:"#e85a5a", fontSize:12, marginTop:4 }}>{errors.admin}</div>}
          {errors.adminLen && <div style={{ color:"#e85a5a", fontSize:12, marginTop:4 }}>{errors.adminLen}</div>}
          <div style={{ fontSize:11, color:"#444", marginTop:6 }}>Admin kann alle Reisen sehen + PINs verwalten</div>
        </div>

        <div style={{ height:1, background:"#1e2235", marginBottom:20 }}/>

        <div style={{ fontWeight:700, color:"#a0e4c8", marginBottom:12, fontSize:14 }}>🏖 Reise-PINs</div>
        {reisen.map(r => (
          <div key={r.id} style={{ background:"#1a1d2e", borderRadius:10, padding:12, marginBottom:10 }}>
            <div style={{ fontWeight:600, color:"#e0e2f0", marginBottom:10 }}>{r.emoji} {r.name}</div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
              <div><label style={lbl}>PIN</label>
                <input style={inp} type="password" inputMode="numeric" maxLength={8} placeholder="••••"
                  value={reisePins[r.id]||""} onChange={e=>setReisePins(p=>({...p,[r.id]:e.target.value.replace(/\D/g,"")}))} /></div>
              <div><label style={lbl}>Wiederholen</label>
                <input style={inp} type="password" inputMode="numeric" maxLength={8} placeholder="••••"
                  value={reisePins2[r.id]||""} onChange={e=>setReisePins2(p=>({...p,[r.id]:e.target.value.replace(/\D/g,"")}))} /></div>
            </div>
            {errors[r.id] && <div style={{ color:"#e85a5a", fontSize:12, marginTop:4 }}>{errors[r.id]}</div>}
            <div style={{ fontSize:11, color:"#444", marginTop:6 }}>
              {pins[r.id] ? "✓ PIN gesetzt" : "Noch keine PIN gesetzt"}
            </div>
          </div>
        ))}

        <button onClick={handleSave} disabled={saving}
          style={{ background: saved?"linear-gradient(90deg,#2a6a3a,#3a8a4a)":"linear-gradient(90deg,#4a7fd4,#5aabda)",
            border:"none", color:"#fff", borderRadius:12, padding:"12px 0", width:"100%",
            cursor:"pointer", fontWeight:800, fontSize:15, marginTop:8 }}>
          {saved ? "✓ Gespeichert!" : saving ? "Speichere…" : "PINs speichern"}
        </button>
      </div>
    </div>
  );
}

function AppWithSync() {
  const seed = useMemo(() => makeSeedData(), []);
  const [personen,   setPersonenState] = useState(seed.personen);
  const [reisen,     setReisenState]   = useState(seed.reisen);
  const [syncStatus, setSyncStatus]    = useState("laden");
  const [lastSaved,  setLastSaved]     = useState(null);
  const [pins,       setPinsState]     = useState({});
  const [pinsLoaded,  setPinsLoaded]    = useState(false);
  const [authState,  setAuthState]     = useState(null); // null=loading, {role,reiseId}=ok
  const [showPinMgr, setShowPinMgr]   = useState(false);
  const localVersion = useRef(0);
  const isFirstLoad  = useRef(true);
  const personenRef  = useRef(seed.personen);
  const reisenRef    = useRef(seed.reisen);

  useEffect(() => {
    if (!window.fbSubscribe) { setSyncStatus("fehler"); return; }
    const unsubscribe = window.fbSubscribe((data) => {
      try {
        if (!data) {
          window.fbSave({ personen: seed.personen, reisen: seed.reisen, version: 1, pins: {} })
            .then(() => { setSyncStatus("ok"); setLastSaved(new Date()); })
            .catch(() => setSyncStatus("fehler"));
          isFirstLoad.current = false;
          setPinsLoaded(true);
          document.getElementById('loading').style.display = 'none';
          setAuthState({ role:"admin", reiseId: null });
          return;
        }
        const incoming = data.version || 0;
        if (isFirstLoad.current || incoming > localVersion.current) {
          const p = (data.personen || seed.personen).map(p => ({ id:"", name:"", nachname:"", farbe:"#888", ...p }));
          const r = (data.reisen || seed.reisen).map(r => ({
            ...r,
            gruppen:      (r.gruppen      || []).map(g => ({ id:"", name:"", farbe:"#888", mitglieder:[], ...g })),
            ausgaben:     (r.ausgaben     || []).map(a => ({ id:"", beschreibung:"", betrag:0, datum:"", bezahlerTyp:"person", bezahlerId:"", verteilungsModus:"alle", verteilungsZiele:[], extrakosten:[], ...a })),
            einzahlungen: (r.einzahlungen || []).map(e => ({ id:"", personId:"", betrag:0, notiz:"", datum:"", ...e })),
            anwesenheit:  r.anwesenheit   || {},
            personenIds:  Array.isArray(r.personenIds) ? r.personenIds : [],
          }));
          personenRef.current = p;
          reisenRef.current   = r;
          setPersonenState(p);
          setReisenState(r);
          const loadedPins = data.pins || {};
          setPinsState(loadedPins);
          setPinsLoaded(true);
          // Direkt hier prüfen ob PIN-Screen nötig ist
          if (!authState) {
            const hasPins = Object.keys(loadedPins).length > 0;
            if (!hasPins) setAuthState({ role:"admin", reiseId: null });
          }
          localVersion.current = incoming;
          setLastSaved(new Date());
          setSyncStatus("ok");
          isFirstLoad.current = false;
          document.getElementById('loading').style.display = 'none';
        }
      } catch(e) { setSyncStatus("fehler"); }
    });
    return unsubscribe;
  }, []);

  function doSave(p, r, newPins) {
    const pinsToSave = newPins !== undefined ? newPins : pins;
    personenRef.current = p;
    reisenRef.current   = r;
    setSyncStatus("speichern");
    const v = localVersion.current + 1;
    localVersion.current = v;
    window.fbSave({ personen: p, reisen: r, version: v, pins: pinsToSave })
      .then(() => { setSyncStatus("ok"); setLastSaved(new Date()); })
      .catch(() => setSyncStatus("fehler"));
  }

  const setPersonen = useCallback((p) => {
    if (typeof p === 'function') p = p(personenRef.current);
    setPersonenState(p);
    doSave(p, reisenRef.current);
  }, []);
  const setReisen = useCallback((r) => {
    if (typeof r === 'function') r = r(reisenRef.current);
    setReisenState(r);
    doSave(personenRef.current, r);
  }, []);

  async function savePins(newPins) {
    setPinsState(newPins);
    doSave(personenRef.current, reisenRef.current, newPins);
  }

  // Keine PINs gesetzt → auto-login als Admin via useEffect
  // Wir prüfen direkt im Firebase-Callback (siehe fbSubscribe unten)
  // Dieser useEffect ist nur als Fallback
  useEffect(() => {
    if (syncStatus === "ok" && !authState && pinsLoaded) {
      const hasPins = Object.keys(pins).length > 0;
      if (!hasPins) setAuthState({ role:"admin", reiseId: null });
    }
  }, [syncStatus, pinsLoaded]); // Nur wenn pinsLoaded sich ändert

  // Noch laden oder warten bis Pins geladen sind
  if (syncStatus === "laden" || !pinsLoaded) return null;

  // PIN-Screen: zeigen wenn nicht authentifiziert und PINs gesetzt sind
  const hasPins = Object.keys(pins).length > 0;
  if (!authState) {
    if (hasPins) {
      return <PinScreen reisen={reisen} pins={pins} onUnlock={(role, reiseId) => setAuthState({role, reiseId})} />;
    }
    // Keine PINs → warte auf useEffect/Firebase-Callback für auto-login
    return null;
  }

  // Gefilterte Reisen je nach Rolle
  const sichtbareReisen = authState.role === "admin"
    ? reisen
    : reisen.filter(r => r.id === authState.reiseId);

  return (
    <>

      {showPinMgr && authState.role === "admin" && (
        <PinManager reisen={reisen} pins={pins} onSave={savePins} onClose={()=>setShowPinMgr(false)} />
      )}
      <App
        personen={personen} setPersonen={setPersonen}
        reisen={sichtbareReisen} setReisen={setReisen}
        syncStatus={syncStatus} lastSaved={lastSaved}
        isAdmin={authState.role === "admin"}
        onPinManager={()=>setShowPinMgr(true)}
        onLogout={()=>setAuthState(null)}
        pins={pins||{}}
        onSavePin={async (reiseId, pin) => {
          const hashed = await hashPin(pin);
          const newPins = {...(pins||{}), [reiseId]: hashed};
          await savePins(newPins);
        }}
        onClearPin={(reiseId) => {
          const newPins = {...(pins||{})};
          delete newPins[reiseId];
          savePins(newPins);
        }}
      />
    </>
  );
}

try {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<AppWithSync />);
} catch(e) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error-screen').classList.add('show');
  document.getElementById('error-msg').textContent = 'React-Fehler: ' + e.message;
}
</script>
</body>
</html>
